[package]
name = "rail-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Test-only crates approved for reading tests/acceptance/suites.toml
# (docs/dependencies.md). rail-testkit is never shipped.
rail-json = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.7", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
rail-tools = { workspace = true }
